services:
  nextjs:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

  express:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_USER: bank_app
      DB_PASSWORD: bank_password
      DB_NAME: bank_test
    depends_on:
      mysql-test:
        condition: service_healthy
    ports:
      - "3001:3001"


  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank_test
      MYSQL_USER: bank_app
      MYSQL_PASSWORD: bank_password
    ports:
      - "3308:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
      - ./database/test-init.sql:/docker-entrypoint-initdb.d/test-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-test-data: